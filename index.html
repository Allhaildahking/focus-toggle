<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">FOCUS TOGGLE</p>

    <h1 id="title">Ready to focus?</h1>

    <p id="message">
      Remove the noise. Get one thing done.
    </p>

    <button id="focusToggle" type="button" aria-pressed="false">
      <span class="toggle-track">
        <span class="toggle-knob"></span>
      </span>

      <span id="toggleText">Focus Mode</span>
    </button>

    <p class="status" id="status">Focus mode is off.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
